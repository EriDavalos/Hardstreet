<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/me/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!--
    Color de la BARRA DE ESTADO cuando la app se instala desde la web (PWA).
    El `theme_color` del manifest es el que manda en la app instalada (Chrome
    lo usa para la barra de notificaciones y no lee este meta), así que ambos
    van con el fondo OSCURO de la app y no con el azul de la marca.
  -->
  <meta name="theme-color" content="#0C111C">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Hardstreet Platform">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Hardstreet Platform</title>
  <link rel="manifest" href="manifest.json">

  <!--
    SALVAVIDAS DEL ATRÁS DEL NAVEGADOR (solo web).

    En la web, el panel vive en UNA sola entrada del historial que el motor de
    Flutter vuelve a poner DESPUÉS de cada atrás. En el teléfono eso no basta:
    Chrome descarta las entradas que se empujan **dentro** de la misma acción de
    atrás (lo hace para que una página no secuestre el botón) así que el gesto
    se saltaba esa entrada y la pestaña salía del panel (en el teléfono, además,
    cerraba la pestaña y volvía al inicio del navegador).

    Aquí se deja SIEMPRE una entrada de salvavidas debajo de la actual, escrita
    con la forma que el motor de Flutter reconoce como «la entrada desde la que
    se llegó a la app». Al pulsar atrás se cae en ella, el motor re-arma la suya
    y entrega el gesto a la app (cerrar la foto, subir de carpeta, volver al
    módulo, preguntar antes de salir) en vez de salirse.

    Dos detalles que hacen que funcione:
      1. Se empuja en un `setTimeout`, NUNCA dentro del propio atrás: es la
         entrada que Chrome sí conserva.
      2. Se arma con el gesto del usuario (el toque que acaba de dar en el
         panel), que es cuando el navegador no marca la entrada como
         descartable.

    Lo enciende el panel al montarse (`setWebBackGuard`, ver lib/back_nav.dart):
    en el login no se arma, así que ahí el atrás sigue siendo del navegador.
  -->
  <script>
    (function () {
      var enabled = false;
      var armedAtStart = false;
      var armedWithGesture = false;

      function arm() {
        if (!enabled) return;
        window.setTimeout(function () {
          var current = history.state;
          var mine =
            current && typeof current === 'object' && current.flutter
              ? current
              : { flutter: true };
          // A) El salvavidas. `origin` es la marca que lee el motor de Flutter:
          //    al volver aquí rearma su entrada y manda el atrás a la app.
          history.pushState({ origin: true, state: null }, '', location.href);
          // B) La entrada actual, para que el atrás caiga en A y no en B.
          history.pushState(mine, '', location.href);
        }, 0);
      }

      // El panel avisa cuando está en pantalla (y cuando se va).
      window.__hsBackGuard = function (on) {
        enabled = !!on;
        if (!enabled || armedAtStart) return;
        armedAtStart = true;
        arm();
      };

      // El primer toque dentro del panel vuelve a armar con gesto del usuario:
      // es el momento en el que Chrome ya no puede descartar la entrada.
      ['pointerdown', 'touchstart', 'mousedown', 'keydown'].forEach(function (
        name,
      ) {
        document.addEventListener(
          name,
          function () {
            if (!enabled || armedWithGesture) return;
            armedWithGesture = true;
            arm();
          },
          { capture: true, passive: true },
        );
      });
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
