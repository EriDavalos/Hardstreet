<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a1408">
  <title>Para ti 🌻 | Hard Street</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="parati.css?v=4">
</head>
<body>

  <!-- Fondo: auroras doradas y estrellas -->
  <div class="bg" aria-hidden="true">
    <div class="aurora a1"></div>
    <div class="aurora a2"></div>
    <div class="aurora a3"></div>
    <div class="star" style="top:12%; left:8%;  --tw:2.8s; --td:0s"></div>
    <div class="star" style="top:22%; left:85%; --tw:3.4s; --td:.7s"></div>
    <div class="star" style="top:8%;  left:60%; --tw:2.2s; --td:1.3s"></div>
    <div class="star" style="top:34%; left:18%; --tw:3.9s; --td:2s"></div>
    <div class="star" style="top:16%; left:38%; --tw:2.6s; --td:.4s"></div>
    <div class="star" style="top:40%; left:92%; --tw:3.1s; --td:1.8s"></div>
    <div class="star" style="top:28%; left:70%; --tw:2.9s; --td:2.6s"></div>      <div class="star" style="top:47%; left:5%;  --tw:3.6s; --td:.9s"></div>
      <div class="shooting-star" aria-hidden="true"></div>
      <div class="shooting-star s2" aria-hidden="true"></div>
  </div>

  <main class="stage">
    <!-- Título -->
    <header class="title">
      <span class="eyebrow"><i></i>Una flor amarilla para ti<i></i></span>
      <h1>Para&nbsp;Ti <span class="flower-glyph">✿</span></h1>
      <p class="subtitle">Tal vez no es físico, pero es un detalle.</p>
    </header>

    <!-- Escena -->
    <section class="scene" aria-label="Flor amarilla animada">
      <div class="sun" aria-hidden="true"><div class="sun-rays"></div><div class="sun-core"></div><div class="halo"></div></div>

      <div class="hill hill-back" aria-hidden="true"></div>
      <div class="hill hill-front" aria-hidden="true">
        <i class="grass-blade" style="left:3%;  --gh:34px; --gd:.2s"></i>
        <i class="grass-blade" style="left:8%;  --gh:26px; --gd:1.1s"></i>
        <i class="grass-blade" style="left:14%; --gh:40px; --gd:.6s"></i>
        <i class="grass-blade" style="left:22%; --gh:22px; --gd:1.7s"></i>
        <i class="grass-blade" style="left:31%; --gh:30px; --gd:.9s"></i>
        <i class="grass-blade" style="left:44%; --gh:20px; --gd:.3s"></i>
        <i class="grass-blade" style="left:56%; --gh:28px; --gd:1.4s"></i>
        <i class="grass-blade" style="left:67%; --gh:36px; --gd:.1s"></i>
        <i class="grass-blade" style="left:76%; --gh:24px; --gd:2s"></i>
        <i class="grass-blade" style="left:85%; --gh:38px; --gd:.8s"></i>
        <i class="grass-blade" style="left:93%; --gh:27px; --gd:1.6s"></i>
      </div>

      <div class="butterfly" aria-hidden="true">
        <span class="wing wl"></span><span class="wing wr"></span><span class="b-body"></span>
      </div>
      <div class="bee bee-a" aria-hidden="true"><span class="wing wl"></span><span class="wing wr"></span><span class="bee-body"></span><span class="bee-head"></span></div>
      <div class="bee bee-b" aria-hidden="true"><span class="wing wl"></span><span class="wing wr"></span><span class="bee-body"></span><span class="bee-head"></span></div>
      <span class="bee-trail trail-a" aria-hidden="true"></span>
      <span class="bee-trail trail-b" aria-hidden="true"></span>
      <div class="firefly" style="--fx1:14%; --fy1:52%; --fx2:40%; --fy2:30%; --fd:0s"   aria-hidden="true"></div>
      <div class="firefly" style="--fx1:82%; --fy1:60%; --fx2:64%; --fy2:38%; --fd:1.6s" aria-hidden="true"></div>
      <div class="firefly" style="--fx1:30%; --fy1:70%; --fx2:74%; --fy2:64%; --fd:3.1s" aria-hidden="true"></div>

      <!-- La flor -->
      <div class="plant">
        <svg class="stem" viewBox="0 0 200 240" aria-hidden="true">
          <path d="M100 240 C 96 180, 108 130, 100 62" fill="none"/>
        </svg>
        <span class="leaf leaf-l" aria-hidden="true"></span>
        <span class="leaf leaf-r" aria-hidden="true"></span>
        <div class="flower" id="flower" role="button" tabindex="0" aria-label="Toca la flor">
          <div class="rays" aria-hidden="true"></div>
          <div class="rays rays2" aria-hidden="true"></div>
          <!-- pétalos: generados por parati.js -->
          <div class="core"><span class="core-ring"></span><i class="core-dot" style="--a:0deg"></i><i class="core-dot" style="--a:60deg"></i><i class="core-dot" style="--a:120deg"></i><i class="core-dot" style="--a:180deg"></i><i class="core-dot" style="--a:240deg"></i><i class="core-dot" style="--a:300deg"></i></div>
        </div>
        <span class="sway-note" aria-hidden="true"></span>
      </div>
    </section>

    <!-- Interfaz -->
    <footer class="hud">

      <button class="replant" id="replant" type="button">Volver a florecer ⟳</button>
      <p class="hint" id="hint">Toca la flor</p>
    </footer>
    <p class="credit">Hecha con cariño · Eri</p>
  </main>

  <script src="parati.js?v=1"></script>
</body>
</html>
