<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>Mis Fotos | Hard Street</title>
  <link rel="icon" href="../../images/LOG.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/dashboard.css?v=54" />
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <img src="../../images/LOG-SB.png" alt="Hard Street" />
      <span class="brand-text">Hard Street</span>
      <button class="sidebar-close" onclick="toggleSidebar()" aria-label="Cerrar menú">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <nav class="sidebar-nav">
      <button class="sidebar-item" data-tab="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>Inicio</span>
      </button>
      <button class="sidebar-item" data-tab="package">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
          <line x1="12" y1="22.08" x2="12" y2="12"/>
        </svg>
        <span>Mi Paquete</span>
      </button>
      <button class="sidebar-item active" data-tab="photos">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
        <span>Mis Fotos</span>
      </button>
    </nav>

    <div class="sidebar-footer">
      <div class="user-card">
        <div class="user-avatar" id="userAvatar">CD</div>
        <div class="user-info">
          <span class="user-name" id="userName">Cliente Demo</span>
          <span class="user-email" id="userEmail">cliente@demo.com</span>
        </div>
      </div>
      <button class="logout-btn" onclick="handleLogout()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        <span>Cerrar Sesión</span>
      </button>
    </div>
  </aside>

  <!-- Mobile Header -->
  <header class="mobile-header">
    <button class="menu-toggle" onclick="toggleSidebar()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
    <img src="../../images/LOG-SB.png" alt="Hard Street" class="mobile-logo" />
    <div class="mobile-user" id="mobileUser">CD</div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <section class="tab-content active" id="photosTab">
      <div class="page-header">
        <div>
          <h1 class="page-title">Mis Fotos</h1>
          <p class="page-subtitle">Selecciona y descarga tus fotos</p>
        </div>
        <div class="header-actions">
          <span class="selection-count" id="selectionCount">0 seleccionadas</span>
          <button class="btn-primary" id="downloadBtn" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            Descargar
          </button>
        </div>
      </div>

      <!-- Photo Stats -->
      <div class="photo-stats-row">
        <div class="photo-stat">
          <span class="photo-stat-value" id="photoCount">0</span>
          <span class="photo-stat-label">Total</span>
        </div>
        <div class="photo-stat ready">
          <span class="photo-stat-value" id="photoReadyCount">0</span>
          <span class="photo-stat-label">Listas</span>
        </div>
      </div>

      <!-- Photo Filters -->
      <div class="photo-filters">
        <button class="filter-btn active" data-filter="all">Todas</button>
        <button class="filter-btn" data-filter="public">Públicas</button>
        <button class="filter-btn" data-filter="private">Privadas</button>
        <button class="filter-btn" data-filter="video">Videos / PDF</button>
      </div>

      <div class="photos-grid" id="photosGrid">
        <!-- Rendered by JS -->
      </div>

      <div class="empty-state" id="emptyState" style="display: none;">
        <div class="empty-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
        </div>
        <h3>Sin fotos disponibles</h3>
        <p>Tus fotos aparecerán aquí cuando estén listas</p>
      </div>
    </section>
  </main>

  <!-- Photo Preview Modal -->
  <div class="preview-modal" id="photoPreviewModal">
    <button class="preview-close" onclick="closePhotoPreview()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
    <div class="preview-body" id="previewContent">
      <!-- Rendered by JS -->
    </div>
  </div>

  <!-- Overlay for mobile sidebar -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

  <script>window.DASHBOARD_MODULE = 'photos';</script>
  <script src="../assets/config.js?v=5"></script>
  <script src="../assets/models.js?v=6"></script>
  <script src="../assets/api.js?v=6"></script>
  <script src="../assets/renderers.js?v=5"></script>
  <script src="../assets/dashboard-core.js?v=3"></script>
</body>
</html>
